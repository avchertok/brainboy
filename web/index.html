<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainBoy Abu Dhabi</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1c2333;
    --muted: #6b7385;
    --accent: #4f6ef7;
    --accent-soft: #eef1fe;
    --border: #e5e8f0;
    --gold: #f5b301;
    --place1-bg: #fff9e6;
    --hero-from: #4f6ef7;
    --hero-to: #8b5cf6;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 12px rgba(16, 24, 40, 0.06);
    --shadow-lift: 0 2px 4px rgba(16, 24, 40, 0.06), 0 10px 24px rgba(16, 24, 40, 0.1);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #14161d;
    --card: #1d2129;
    --text: #e7eaf3;
    --muted: #98a1b3;
    --accent: #6b85ff;
    --accent-soft: #272e44;
    --border: #2d3340;
    --gold: #f5c542;
    --place1-bg: #2e2a1a;
    --hero-from: #3c4fd0;
    --hero-to: #6f3fd4;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.3);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.4), 0 10px 26px rgba(0, 0, 0, 0.42);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  .container { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }
  header { margin-bottom: 28px; }
  .hero {
    background:
      radial-gradient(120% 160% at 100% 0%, rgba(255, 255, 255, 0.14), transparent 55%),
      linear-gradient(135deg, var(--hero-from), var(--hero-to));
    border-radius: 20px;
    padding: 28px 28px 30px;
    color: #fff;
    box-shadow: var(--shadow);
  }
  .hero h1 { color: #fff; font-size: 2.1rem; }
  .hero .subtitle { color: rgba(255, 255, 255, 0.82); }
  .season-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.32);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  /* контролы поверх градиента — полупрозрачное «стекло» */
  .hero #theme-toggle,
  .hero .seg {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.32);
  }
  .hero #theme-toggle:hover {
    background: rgba(255, 255, 255, 0.26);
    border-color: rgba(255, 255, 255, 0.5);
  }
  .hero .seg button { color: rgba(255, 255, 255, 0.85); }
  .hero .seg button + button { border-left-color: rgba(255, 255, 255, 0.32); }
  .hero .seg button.active { background: #fff; color: var(--accent); }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
  }
  #theme-toggle:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  #lang-seg button { padding: 10px 12px; font-weight: 600; }
  h1 { font-size: 1.9rem; letter-spacing: -0.02em; line-height: 1.2; }
  .subtitle { color: var(--muted); margin-top: 6px; }
  h2 {
    font-size: 1.35rem;
    margin: 44px 0 16px;
    letter-spacing: -0.01em;
    position: relative;
    padding-left: 14px;
  }
  h2::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.2em;
    bottom: 0.2em;
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(var(--hero-from), var(--hero-to));
  }
  h3 { font-size: 1.05rem; margin: 22px 0 10px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }
  .card .value { font-size: 1.6rem; font-weight: 700; }
  .card .label { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }

  .controls {
    position: relative; /* якорь для .seg-tip */
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }
  .seg {
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 8px 14px;
    min-height: 40px; /* тач-таргет */
    font: inherit;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* видимый намёк на подсказку у кнопки олимпийской системы */
  .hint-q {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    margin-left: 6px;
    border: 1px solid currentColor;
    border-radius: 50%;
    font-size: 0.68rem;
    font-weight: 600;
    line-height: 1;
    opacity: 0.75;
    vertical-align: 1px;
  }
  /* расширенная зона тапа вокруг маленького кружка «?» */
  .hint-q::after {
    content: "";
    position: absolute;
    inset: -12px;
  }
  /* кастомный тултип; позиционируется от .controls, поэтому
     overflow:hidden у .seg его не обрезает */
  .seg-tip {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 10;
    max-width: min(360px, calc(100vw - 48px));
    padding: 8px 12px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    font-size: 0.82rem;
    font-weight: 400;
    white-space: normal;
    text-align: left;
    pointer-events: none; /* не перехватывает тапы — переключение работает */
    opacity: 0;
    visibility: hidden;
  }
  /* hover-показ только на устройствах с настоящим ховером: на таче iOS
     "залипающий" :hover оставлял бы тултип висеть после переключения */
  @media (hover: hover) {
    #system-seg button[data-system="olympic"]:hover .seg-tip {
      opacity: 1;
      visibility: visible;
    }
  }
  /* тап-переключение на таче: класс tip-open ставит и снимает JS */
  #system-seg button[data-system="olympic"]:focus-visible .seg-tip,
  #system-seg button[data-system="olympic"].tip-open .seg-tip {
    opacity: 1;
    visibility: visible;
  }

  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; white-space: nowrap; }
  th {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover {
    color: var(--accent);
    background: var(--accent-soft);
    text-decoration: underline dotted;
    text-underline-offset: 3px;
  }
  .sort-arrow { font-size: 0.78em; margin-left: 3px; opacity: 0.4; }
  .sort-arrow.active { opacity: 1; color: var(--accent); }
  .sort-hint { color: var(--muted); font-size: 0.78rem; margin: -6px 0 8px; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .team-name { font-weight: 600; }
  .medal { margin-right: 4px; }
  .rating-col { color: var(--accent); font-weight: 700; }

  .chart-wrap {
    position: relative; /* контейнер размеров для Chart.js */
    height: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
  }

  /* ---- подиум топ-3 над таблицей рейтинга ---- */
  .podium {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    align-items: end;
    margin-bottom: 18px;
  }
  .p-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    text-align: center;
    padding: 16px 10px 14px;
    min-width: 0;
  }
  .p-card .p-medal { font-size: 1.9rem; line-height: 1.15; }
  .p-card .p-name {
    font-weight: 700;
    font-size: 0.95rem;
    margin-top: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .p-card .p-value {
    color: var(--accent);
    font-weight: 800;
    font-size: 1.35rem;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .p-card.p1 {
    padding-top: 24px;
    padding-bottom: 22px;
    border-color: var(--gold);
    background: linear-gradient(var(--place1-bg), var(--card) 70%);
  }
  .p-card.p1 .p-medal { font-size: 2.3rem; }
  .p-card.p1 .p-value { font-size: 1.55rem; }

  /* ---- мобильная подача рейтинга (карточки вместо таблицы) ---- */
  .m-standings { display: none; }
  .m-sort { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .m-sort label { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
  .m-sort select {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 0.9rem;
    padding: 0 10px;
  }
  .m-sort button {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--accent);
    font-size: 1.15rem;
    cursor: pointer;
  }
  .m-team-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .m-team {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .m-rank {
    flex-shrink: 0;
    width: 34px;
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .m-main { flex: 1; min-width: 0; }
  .m-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .m-chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 5px; }
  .chip {
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .m-value { flex-shrink: 0; text-align: right; }
  .m-value .v {
    color: var(--accent);
    font-weight: 800;
    font-size: 1.15rem;
    font-variant-numeric: tabular-nums;
  }
  .m-value .l {
    display: block;
    color: var(--muted);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: -2px;
  }

  .game {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  /* мобильная сводка топ-3 игры и кнопка раскрытия раундов;
     на десктопе скрыты — там таблица видна сразу */
  .g-top3 { display: none; list-style: none; margin: 2px 0 10px; }
  .g-top3 li { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 3px 0; }
  .g-top3 .g-medal { flex-shrink: 0; }
  .g-top3 .g-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }
  .g-top3 .g-pts { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .game-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--accent);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .game-toggle .g-arrow { font-size: 0.75em; }
  .game.expanded .game-toggle { margin-bottom: 10px; }
  .game.expanded .g-arrow { display: inline-block; transform: rotate(180deg); }
  .game-head {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .game-title { font-weight: 700; font-size: 1.05rem; }
  .game-meta { color: var(--muted); font-size: 0.88rem; }
  .game .table-wrap { border-radius: 10px; }
  .game th.round, .game td.round {
    padding-left: 8px; padding-right: 8px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .place-1 td { background: var(--place1-bg); }

  .games-note {
    color: var(--muted); font-size: 0.8rem; margin-top: 8px;
  }

  .leader-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .leader-badge .who { font-weight: 700; }

  .empty {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 56px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty .emoji { font-size: 2.6rem; display: block; margin-bottom: 14px; }
  .empty strong { color: var(--text); font-size: 1.1rem; }
  .empty p { margin-top: 6px; }
  .empty code {
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.9em;
  }

  footer { margin-top: 44px; color: var(--muted); font-size: 0.82rem; }

  @media (max-width: 640px) {
    .container { padding-top: 14px; }
    .hero { padding: 20px 18px 22px; border-radius: 16px; }
    .hero h1 { font-size: 1.5rem; }
    .hero .subtitle { font-size: 0.9rem; }
    h1 { font-size: 1.45rem; }
    h2 { font-size: 1.15rem; margin-top: 32px; }
    .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { padding: 12px 14px; min-width: 0; }
    .card .value { font-size: 1.3rem; overflow-wrap: break-word; }
    th, td { padding: 8px 9px; font-size: 0.88rem; }
    /* сегмент шире экрана (например, три сезона) скроллится сам,
       не растягивая страницу; min-height кнопок сохраняет тач-таргет */
    .seg { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .seg button { padding: 7px 10px; font-size: 0.82rem; }

    /* рейтинг: вместо широкой таблицы — карточки команд с выбором
       сортировки; горизонтальный скролл не нужен */
    #standings .table-wrap { display: none; }
    .sort-hint { display: none; }
    .m-standings { display: block; }

    /* игры: по умолчанию виден топ-3, полная таблица раундов
       раскрывается кнопкой; внутри раскрытой таблицы скролл со
       sticky-колонкой команды */
    #games .game .table-wrap { display: none; }
    #games .game.expanded .table-wrap { display: block; }
    .g-top3 { display: block; }
    .game-toggle { display: flex; }
    .table-wrap th:nth-child(2),
    .table-wrap td:nth-child(2) {
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--card);
      max-width: 45vw;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: inset -1px 0 0 var(--border);
    }
    .table-wrap tr.place-1 td:nth-child(2) { background: var(--place1-bg); }

    .podium { gap: 8px; }
    .p-card { padding: 12px 6px 10px; border-radius: 14px; }
    .p-card .p-medal { font-size: 1.5rem; }
    .p-card.p1 .p-medal { font-size: 1.9rem; }
    .p-card .p-name { font-size: 0.8rem; }
    .p-card .p-value { font-size: 1.1rem; }
    .p-card.p1 .p-value { font-size: 1.3rem; }

    .chart-wrap { height: 340px; padding: 12px; }
    .game { padding: 12px 14px; }
  }

  /* сдержанные анимации; полностью отключаются при reduced motion */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    #app > *, .hero { animation: fadeUp 0.45s ease both; }
    .seg button, #theme-toggle, .card, .p-card, .m-team, .game-toggle,
    .m-sort button, th.sortable {
      transition: background-color 0.18s ease, color 0.18s ease,
        border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }
    .seg-tip { transition: opacity 0.15s ease; }
  }
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .card:hover, .p-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lift);
    }
  }
</style>
<script>
(function () {
  let t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark" : "light";
  }
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div class="container">
  <header>
    <div class="hero">
      <div class="header-top">
        <div class="hero-text">
          <span class="season-badge" id="season-badge" hidden></span>
          <h1 data-i18n="title">BrainBoy Abu Dhabi</h1>
          <p class="subtitle" data-i18n="subtitle">Рейтинг квиз-команд · игры по воскресеньям, 8 раундов</p>
        </div>
        <div class="header-controls">
          <div class="seg" id="lang-seg">
            <button type="button" data-lang="ru">RU</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <button id="theme-toggle" type="button" title="Переключить тему"
            aria-label="Переключить светлую/тёмную тему">🌙</button>
        </div>
      </div>
    </div>
  </header>

  <div id="app"></div>

  <footer id="footer"></footer>
</div>

<script>
"use strict";

/* ---------- утилиты ---------- */

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
};

/* ---------- i18n ---------- */

const I18N = {
  ru: {
    title: "BrainBoy Abu Dhabi",
    subtitle: "Рейтинг квиз-команд · игры по воскресеньям, 8 раундов",
    themeTitle: "Переключить тему",
    themeAria: "Переключить светлую/тёмную тему",
    gamesPlayed: (n) => plural(n, "игра сыграна", "игры сыграно", "игр сыграно"),

let lang = "ru";
try {
  const savedLang = localStorage.getItem("lang");
  if (savedLang === "ru" || savedLang === "en") lang = savedLang;
} catch (e) {}

const t = (key) => {
  const d = I18N[lang] || I18N.ru;
  return d[key] !== undefined ? d[key] : I18N.ru[key];
};

const fmtDate = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return lang === "en"
    ? d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
    : d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
};

/* яркие «премиальные» цвета топ-3 текущего скоупа/системы:
   янтарный, ярко-синий, терракотовый (в тёмной теме — осветлённые) */
const TOP3_COLORS = {
  light: ["#b8820a", "#2f6bff", "#d95f2b"],
  dark:  ["#f5b31b", "#7fa3ff", "#ff8a5c"],
};
const TOP3_LINE_WIDTH = 2.5;
const OTHER_LINE_WIDTH = 1.5;

/* приглушённая палитра остальных команд — сниженная насыщенность,
   чтобы график не рябил и топ-3 визуально доминировал */
const PALETTE = [
  "#7d8fb8", "#b8858e", "#7fa98c", "#a289bd", "#76a5b1", "#b585a8",
  "#8ba37b", "#6e8ba3", "#6f9e9c", "#9f7fa3", "#95a86f", "#7b93a8",
];

/* те же оттенки, осветлённые для читаемости на тёмном фоне */
const PALETTE_DARK = [
  "#93a5cf", "#cf9aa4", "#94bfa1", "#b9a0d4", "#8dbcc8", "#cc9dbf",
  "#a2ba90", "#87a4bc", "#86b5b3", "#b696ba", "#adbf85", "#93abc0",
];

const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };

/* ---------- состояние переключателей ---------- */

const state = {
  season: "all",       // "all" | "2025" | "2026" | ...
  system: "points",    // "points" | "olympic"
  sortKey: "rating",   // столбец сортировки таблицы рейтинга
  sortDir: "desc",     // "asc" | "desc"
};

/* направление первого клика по столбцу; для «лучшего места» меньше = лучше */
const SORT_DEFAULT_DIR = {
  rank: "asc", name: "asc", rating: "desc", games_played: "desc",
  wins: "desc", podiums: "desc", avg_points: "desc", best_place: "asc",
};

let DATA = null;
let ratingChart = null;

/* ---------- тема ---------- */

function currentTheme() {
  return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("theme", theme); } catch (e) {}
  const btn = document.getElementById("theme-toggle");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
  if (ratingChart) updateRatingChart();
}

/* цвета интерфейса графика из CSS-переменных текущей темы */
function chartUiColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = (name, fallback) => (cs.getPropertyValue(name) || "").trim() || fallback;
  return {
    text: v("--text", "#1c2333"),
    muted: v("--muted", "#6b7385"),
    grid: v("--border", "#e5e8f0"),
  };
}

function renderSummary() {

  const games = scope.history.dates.length;

      <div class="card"><div class="value">${teams}</div>

        <div class="label">${t("lastGame")}</div></div>

function seasonButtons() {

function systemButtons() {

    `<span class="seg-tip" role="tooltip">${esc(t("olympicHint"))}</span>`;
  const opts = [["points", t("byPoints"), ""], ["olympic", t("olympic"), olympicExtra]];
  return `<div class="seg" id="system-seg">` + opts.map(([val, label, extra]) =>

  ).join("") + `</div>`;

/* подписи столбцов; используются и таблицей, и мобильными карточками */
function colLabels(key) {
  return {
    rank: "#",
    name: t("colTeam"),
    rating: key === "points" ? t("colPoints") : t("colOlympic"),
    games_played: t("colGames"),
    wins: t("colWins"),
    podiums: t("colPodiums"),
    avg_points: t("colAvg"),
    best_place: t("colBest"),
  };
}

/* подиум топ-3 по рейтингу активной системы (порядок карточек 2-1-3) */
function renderPodium(baseTeams, key) {
  if (baseTeams.length < 3) return "";
  const order = [baseTeams[1], baseTeams[0], baseTeams[2]];
  return `<div class="podium">` + order.map((team) => {
    const v = key === "points" ? team.points : team.olympic;
    return `
      <div class="p-card p${team.rank}">
        <div class="p-medal">${MEDALS[team.rank]}</div>
        <div class="p-name" title="${esc(team.name)}">${esc(team.name)}</div>
        <div class="p-value">${v}</div>
      </div>`;
  }).join("") + `</div>`;
}

/* мобильная подача рейтинга: селектор сортировки + карточки команд,
   крупно — метрика активной сортировки, остальное чипсами */
function renderMobileStandings(teams, key) {
  const labels = colLabels(key);
  const sk = state.sortKey;
  const bigKey = (sk === "rank" || sk === "name") ? "rating" : sk;
  const metricVal = (team, k) =>
    k === "rating" ? (key === "points" ? team.points : team.olympic) : team[k];

  const sortOptions = ["rating", "games_played", "wins", "podiums", "avg_points", "best_place", "name"]
    .map((k) =>
      `<option value="${k}" ${sk === k ? "selected" : ""}>${labels[k]}</option>`
    ).join("");

  const chipKeys = ["rating", "games_played", "wins", "podiums", "avg_points", "best_place"]
    .filter((k) => k !== bigKey);

  const items = teams.map((team) => {
    const chips = chipKeys.map((k) =>
      `<span class="chip">${labels[k]} <b>${metricVal(team, k) ?? "—"}</b></span>`
    ).join("");
    return `
      <li class="m-team">
        <span class="m-rank">${MEDALS[team.rank] || team.rank}</span>
        <div class="m-main">
          <div class="m-name">${esc(team.name)}</div>
          <div class="m-chips">${chips}</div>
        </div>
        <div class="m-value">
          <span class="v">${metricVal(team, bigKey) ?? "—"}</span>
          <span class="l">${labels[bigKey]}</span>
        </div>
      </li>`;
  }).join("");

  return `
    <div class="m-standings">
      <div class="m-sort">
        <label for="m-sort-key">${t("sortBy")}</label>
        <select id="m-sort-key">${sortOptions}</select>
        <button id="m-sort-dir" type="button" aria-label="${esc(t("sortDirAria"))}">
          ${state.sortDir === "asc" ? "↑" : "↓"}</button>
      </div>
      <ol class="m-team-list">${items}</ol>
    </div>`;
}

function renderStandingsTable() {
  const scope = DATA.scopes[state.season] || DATA.scopes.all;
  const key = state.system;

  /* базовый порядок — по рейтингу активной системы; rank запоминается,
     чтобы колонка «#» всегда показывала исходное место в рейтинге */
  const baseTeams = [...scope.standings]
    .sort((a, b) => (b[key] - a[key]) || (b.points - a.points) || a.name.localeCompare(b.name, lang))
    .map((team, i) => ({ ...team, rank: i + 1 }));
  const teams = [...baseTeams];

  const sk = state.sortKey;
  const dir = state.sortDir === "asc" ? 1 : -1;
  const val = (team) =>
    sk === "rating" ? team[key] : sk === "rank" ? team.rank : team[sk];
  teams.sort((a, b) => {
    if (sk === "name") return dir * a.name.localeCompare(b.name, lang);
    const av = val(a), bv = val(b);
    if (av == null && bv == null) return a.rank - b.rank;
    if (av == null) return 1; // пустые значения всегда внизу
    if (bv == null) return -1;
    return dir * (av - bv) || (a.rank - b.rank);
  });

  const rows = teams.map((team) => {
    const ratingValue = key === "points" ? team.points : team.olympic;
    return `
      <tr>
        <td class="num">${MEDALS[team.rank] ? `<span class="medal">${MEDALS[team.rank]}</span>` : team.rank}</td>
        <td class="team-name">${esc(team.name)}</td>
        <td class="num rating-col">${ratingValue}</td>
        <td class="num">${team.games_played}</td>
        <td class="num">${team.wins}</td>
        <td class="num">${team.podiums}</td>
        <td class="num">${team.avg_points}</td>
        <td class="num">${team.best_place ?? "—"}</td>
      </tr>`;
  }).join("");

  const labels = colLabels(key);
  const cols = ["rank", "name", "rating", "games_played", "wins",
    "podiums", "avg_points", "best_place"].map((k) => [k, labels[k]]);
  const ths = cols.map(([colKey, label]) => {
    const arrow = sk === colKey
      ? `<span class="sort-arrow active">${state.sortDir === "asc" ? "▲" : "▼"}</span>`
      : `<span class="sort-arrow">⇅</span>`;
    const numCls = colKey === "name" ? "" : " num";
    return `<th class="sortable${numCls}" data-sort="${colKey}"` +
      ` aria-sort="${sk === colKey ? (state.sortDir === "asc" ? "ascending" : "descending") : "none"}">` +
      `${label}${arrow}</th>`;
  }).join("");

  return renderPodium(baseTeams, key) +
    renderMobileStandings(teams, key) + `
    <div class="table-wrap">
      <table>
        <thead><tr>${ths}</tr></thead>
        <tbody>${rows || ""}</tbody>
      </table>
    </div>`;
}

function renderRatingBlock() {
  return `
    <h2>${t("rating")}</h2>
    <div class="controls">
      ${seasonButtons()}

    <p class="sort-hint">${t("sortHint")}</p>
    <div id="standings">${renderStandingsTable()}</div>

/* Подписи команд справа от последних точек линий (вместо легенды).
   Подписываются только топ-N команд текущего скоупа/системы, иначе
   40 подписей не разместить; остальные видны через тултип. */
const LABELED_TEAMS = 10;
const LINE_LABEL_FONT = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
const LINE_LABEL_GAP = 12;

/* адаптив подписей: на узких экранах меньше подписываемых команд и
   короче правый отступ, на очень узких подписи выключены (остаются
   тултипы); брейкпоинт 640px совпадает с мобильным медиазапросом CSS */
function chartLabelConfig() {
  const w = window.innerWidth || 1024;
  if (w <= 420) return { count: 0, maxLabelWidth: 0, maxPadRight: 12 };
  if (w <= 640) return { count: 5, maxLabelWidth: 76, maxPadRight: 96 };
  return { count: LABELED_TEAMS, maxLabelWidth: 164, maxPadRight: 180 };
}

function truncateToWidth(ctx, text, maxWidth) {
  if (!maxWidth || ctx.measureText(text).width <= maxWidth) return text;
  let s = text;
  while (s.length > 1 && ctx.measureText(s + "…").width > maxWidth) {
    s = s.slice(0, -1);
  }
  return s + "…";
}

function lastNonNullIndex(arr) {
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i] != null) return i;
  }
  return -1;
}

const lineLabelsPlugin = {
  id: "lineLabels",
  afterDatasetsDraw(chart, args, opts) {
    const { ctx, chartArea } = chart;
    if (!chartArea) return;
    const maxWidth = (opts && opts.maxWidth) || 0;

    const labels = [];
    chart.data.datasets.forEach((ds, i) => {
      if (!ds.showLineLabel || !chart.isDatasetVisible(i)) return;
      const idx = lastNonNullIndex(ds.data);
      if (idx < 0) return;
      const pt = chart.getDatasetMeta(i).data[idx];
      if (!pt) return;
      labels.push({ text: ds.label, color: ds.borderColor, x: pt.x, y: pt.y });
    });
    if (!labels.length) return;

    // разводим перекрытия: сортировка по y, минимальный зазор сверху вниз,
    // затем обратный проход, если нижние вышли за границу области
    labels.sort((a, b) => a.y - b.y);
    let prev = chartArea.top - LINE_LABEL_GAP;
    for (const l of labels) {
      l.ty = Math.max(l.y, prev + LINE_LABEL_GAP);
      prev = l.ty;
    }
    if (prev > chartArea.bottom) {
      let next = chartArea.bottom + LINE_LABEL_GAP;
      for (let i = labels.length - 1; i >= 0; i--) {
        labels[i].ty = Math.min(labels[i].ty, next - LINE_LABEL_GAP);
        next = labels[i].ty;
      }
    }

    ctx.save();
    ctx.font = LINE_LABEL_FONT;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    for (const l of labels) {
      ctx.fillStyle = l.color;
      ctx.fillText(truncateToWidth(ctx, l.text, maxWidth), l.x + 8, l.ty);
    }
    ctx.restore();
  },
};

function updateRatingChart() {
  const scope = DATA.scopes[state.season] || DATA.scopes.all;
  const history = scope.history;
  const key = state.system;
  const theme = currentTheme();
  const palette = theme === "dark" ? PALETTE_DARK : PALETTE;
  const top3 = TOP3_COLORS[theme];
  const ui = chartUiColors();

  // ранжирование команд по итоговому значению рейтинга: топ-3 получают
  // яркие акцентные цвета и линии потолще, остальные — приглушённую
  // палитру и тонкие линии; тем же топ-N рисуем подписи у линий
  const labelCfg = chartLabelConfig();
  const finals = history.series.map((team, i) => {
    const idx = lastNonNullIndex(team[key]);
    return { i, value: idx >= 0 ? team[key][idx] : -Infinity };
  });
  finals.sort((a, b) => b.value - a.value);
  const labeledIdx = new Set(finals.slice(0, labelCfg.count).map((f) => f.i));
  const placeOf = new Map();
  finals.forEach((f, place) => placeOf.set(f.i, place));

  const datasets = history.series.map((team, i) => {
    const place = placeOf.get(i);
    const isTop = place < 3;
    const color = isTop ? top3[place] : palette[(place - 3) % palette.length];
    return {
      label: team.name,
      data: team[key],
      borderColor: color,
      backgroundColor: color,
      spanGaps: true,
      tension: 0.25,
      pointRadius: isTop ? 2 : 1.5,
      pointHoverRadius: 5,
      borderWidth: isTop ? TOP3_LINE_WIDTH : OTHER_LINE_WIDTH,
      showLineLabel: labeledIdx.has(i),
    };
  });

  // правый отступ — под самую длинную из отображаемых подписей,
  // но не длиннее потолка ширины подписи для текущего экрана
  const canvas = document.getElementById("ratingChart");
  const mctx = canvas.getContext && canvas.getContext("2d");
  let padRight = labelCfg.count > 0 ? 24 : 12;
  if (mctx && labelCfg.count > 0) {
    mctx.save();
    mctx.font = LINE_LABEL_FONT;
    for (const ds of datasets) {
      if (ds.showLineLabel) {
        const w = Math.min(mctx.measureText(ds.label).width, labelCfg.maxLabelWidth);
        padRight = Math.max(padRight, w + 16);
      }
    }
    mctx.restore();
  }

  const config = {
    type: "line",
    data: { labels: history.dates.map(fmtDate), datasets },
    options: {
      responsive: true,
      /* высоту задаёт .chart-wrap: без этого на мобильном канвас
         сплющивается до соотношения 2:1 от узкой ширины */
      maintainAspectRatio: false,
      layout: { padding: { right: Math.min(Math.ceil(padRight), labelCfg.maxPadRight) } },
      interaction: { mode: "nearest", intersect: false },
      plugins: {
        legend: { display: false },
        lineLabels: { maxWidth: labelCfg.maxLabelWidth },
        tooltip: {
          callbacks: {
            label: (item) => `${item.dataset.label}: ${item.formattedValue}`,
          },
        },
      },
      scales: {
        x: {
          ticks: { color: ui.muted },
          grid: { color: ui.grid },
        },
        y: {
          beginAtZero: true,
          ticks: { color: ui.muted },
          grid: { color: ui.grid },
          title: {
            display: true,
            text: key === "points" ? t("yPoints") : t("yOlympic"),
            color: ui.text,
          },
        },
      },
    },
    plugins: [lineLabelsPlugin],
  };

  if (ratingChart) ratingChart.destroy();
  ratingChart = new Chart(canvas, config);
}

function refreshRating() {
  document.getElementById("summary").innerHTML = renderSummary();
  document.getElementById("standings").innerHTML = renderStandingsTable();
  document.querySelectorAll("#season-seg button").forEach((b) =>
    b.classList.toggle("active", b.dataset.season === state.season));
  document.querySelectorAll("#system-seg button").forEach((b) =>
    b.classList.toggle("active", b.dataset.system === state.system));
  updateRatingChart();
}

function renderGames() {
  const n = DATA.rounds_count;
  const roundHeaders = Array.from({ length: n }, (_, i) =>
    `<th class="round">${t("roundPrefix")}${i + 1}</th>`).join("");

  const items = [...DATA.games].reverse().map((g) => {
    const rows = g.teams.map((team) => {
      const cells = team.rounds.map((v) =>
        `<td class="round">${v ?? "—"}</td>`).join("");
      return `
        <tr class="${team.place === 1 ? "place-1" : ""}">
          <td class="num">${MEDALS[team.place] ?? team.place ?? "—"}</td>
          <td class="team-name">${esc(team.name)}</td>
          ${cells}
          <td class="num rating-col">${team.total ?? "—"}</td>
        </tr>`;
    }).join("");

    const meta = [fmtDate(g.date), g.venue ? esc(g.venue) : null]
      .filter(Boolean).join(" · ");

    /* мобильная сводка: топ-3 игры с итоговыми очками виден сразу,
       полная таблица раундов раскрывается кнопкой */
    const top3 = g.teams
      .filter((team) => team.place >= 1 && team.place <= 3)
      .sort((a, b) => a.place - b.place)
      .slice(0, 3);
    const top3Html = top3.length ? `<ol class="g-top3">` + top3.map((team) => `
      <li>
        <span class="g-medal">${MEDALS[team.place]}</span>
        <span class="g-name">${esc(team.name)}</span>
        <span class="g-pts">${team.total ?? "—"}</span>
      </li>`).join("") + `</ol>` : "";

    return `
      <div class="game">
        <div class="game-head">
          <span class="game-title">${esc(g.title || t("game") + " " + fmtDate(g.date))}</span>
          <span class="game-meta">${meta}</span>
        </div>
        ${top3Html}
        <button class="game-toggle" type="button" aria-expanded="false">
          <span class="g-label">${t("showRounds")}</span><span class="g-arrow">▼</span>
        </button>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th class="num">${t("colPlace")}</th><th>${t("colTeam")}</th>${roundHeaders}<th class="num">${t("colTotal")}</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }).join("");

  return `
    <h2>${t("gamesHeading")}</h2>
    <p class="games-note" style="margin:-6px 0 14px">${t("gamesNote")}</p>
    <div id="games">${items}</div>`;
}

/* ---------- переключение языка ---------- */

/* обновляет статичные тексты шапки, title и атрибут lang */
function applyChrome() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  const themeBtn = document.getElementById("theme-toggle");
  if (themeBtn) {
    themeBtn.title = t("themeTitle");
    themeBtn.setAttribute("aria-label", t("themeAria"));
  }
  document.querySelectorAll("#lang-seg button").forEach((b) =>
    b.classList.toggle("active", b.dataset.lang === lang));
}

function setLang(next) {
  lang = next === "en" ? "en" : "ru";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyChrome();
  renderApp();
}

/* ---------- инициализация ---------- */

function attachThemeToggle() {
  const themeBtn = document.getElementById("theme-toggle");
  if (!themeBtn) return;
  themeBtn.textContent = currentTheme() === "dark" ? "☀️" : "🌙";
  themeBtn.addEventListener("click", () =>
    setTheme(currentTheme() === "dark" ? "light" : "dark"));
}

function attachLangToggle() {
  const seg = document.getElementById("lang-seg");
  if (!seg) return;
  seg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (!btn || btn.dataset.lang === lang) return;
    setLang(btn.dataset.lang);
  });
}

function attachHandlers() {
  const seasonSeg = document.getElementById("season-seg");
  if (seasonSeg) seasonSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-season]");
    if (!btn) return;
    state.season = btn.dataset.season;
    try { localStorage.setItem("season", state.season); } catch (e) {}
    refreshRating();
  });
  const systemSeg = document.getElementById("system-seg");
  if (systemSeg) systemSeg.addEventListener("click", (e) => {
    /* тап точно по «?» открывает/закрывает тултип и не переключает
       систему; закрытие тапом мимо — глобальный обработчик ниже */
    const q = e.target.closest(".hint-q");
    if (q) {
      q.closest("button").classList.toggle("tip-open");
      return;
    }
    const btn = e.target.closest("button[data-system]");
    if (!btn) return;
    state.system = btn.dataset.system;
    refreshRating();
  });
  /* делегированные обработчики сортировки; висят на контейнере #standings,
     который переживает перерисовки таблицы через innerHTML */
  const standings = document.getElementById("standings");
  if (standings) {
    standings.addEventListener("click", (e) => {
      const dirBtn = e.target.closest("#m-sort-dir");
      if (dirBtn) {
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        standings.innerHTML = renderStandingsTable();
        return;
      }
      const th = e.target.closest("th[data-sort]");
      if (!th) return;
      const colKey = th.dataset.sort;
      if (state.sortKey === colKey) {
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = colKey;
        state.sortDir = SORT_DEFAULT_DIR[colKey] || "desc";
      }
      standings.innerHTML = renderStandingsTable();
    });
    /* мобильный селектор «сортировать по…» */
    standings.addEventListener("change", (e) => {
      const sel = e.target.closest("#m-sort-key");
      if (!sel) return;
      state.sortKey = sel.value;
      state.sortDir = SORT_DEFAULT_DIR[sel.value] || "desc";
      standings.innerHTML = renderStandingsTable();
    });
  }
  /* аккордеоны игр на мобильном */
  const games = document.getElementById("games");
  if (games) games.addEventListener("click", (e) => {
    const btn = e.target.closest(".game-toggle");
    if (!btn) return;
    const expanded = btn.closest(".game").classList.toggle("expanded");
    btn.setAttribute("aria-expanded", expanded ? "true" : "false");
    btn.querySelector(".g-label").textContent =
      expanded ? t("hideRounds") : t("showRounds");
  });
}

/* тап мимо «?» закрывает открытый тултип олимпийской системы */
document.addEventListener("click", (e) => {
  if (e.target.closest(".hint-q")) return;
  document.querySelectorAll("#system-seg button.tip-open")
    .forEach((el) => el.classList.remove("tip-open"));
});

/* полная перерисовка контента (после загрузки данных и при смене языка);
   innerHTML заменяет старые узлы, поэтому обработчики не дублируются */
function renderApp() {
  const app = document.getElementById("app");
  const badge = document.getElementById("season-badge");
  if (badge) {
    const hasSeasons = DATA && DATA.seasons && DATA.seasons.length > 0;
    badge.hidden = !hasSeasons;
    if (hasSeasons) {
      const current = DATA.seasons.map(String).reduce((a, b) => (+b > +a ? b : a));
      badge.textContent = t("season") + " " + current;
    }
  }
  if (!DATA || !DATA.games || DATA.games.length === 0) {
    renderEmpty(app);
  } else {
    app.innerHTML =
      `<div id="summary">${renderSummary()}</div>` +
      renderRatingBlock() +
      renderGames();
    attachHandlers();
    updateRatingChart();
  }
  const footer = document.getElementById("footer");
  footer.textContent = DATA && DATA.generated_at
    ? t("updated") + " " + new Date(DATA.generated_at)
        .toLocaleString(lang === "en" ? "en-US" : "ru-RU")
    : "";
}

/* при смене ширины (поворот телефона) пересобираем график, чтобы
   применились адаптивные подписи и отступы */
let chartResizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(chartResizeTimer);
  chartResizeTimer = setTimeout(() => {
    if (ratingChart) updateRatingChart();
  }, 200);
});

async function init() {
  attachThemeToggle();
  attachLangToggle();
  applyChrome();
  try {
    const resp = await fetch("./data.json");
    DATA = await resp.json();
  } catch (e) {
    DATA = null;
  }
  if (DATA && DATA.games && DATA.games.length && DATA.seasons.length) {
    // дефолт для нового посетителя — текущий (максимальный) сезон;
    // выбор пользователя сохраняется в localStorage
    const seasons = DATA.seasons.map(String);
    let saved = null;
    try { saved = localStorage.getItem("season"); } catch (e) {}
    state.season = (saved === "all" || seasons.includes(saved))
      ? saved
      : seasons.reduce((a, b) => (+b > +a ? b : a));
  }
  renderApp();
}

init();
</script>
